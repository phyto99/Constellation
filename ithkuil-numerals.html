    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: sans-serif;
      background: #0f0f13;
      color: #e2e2e2;
      padding: 2rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #a0a0b0;
    }

    #output {
      font-family: 'IthkuilBasic', sans-serif;
      font-size: 6rem;
      line-height: 1;
      color: #f0f0f0;
      min-height: 7rem;
      display: flex;
      align-items: center;
    }

    #output.flow {
      font-family: 'IthkuilFlow', sans-serif;
    }

    #input {
      width: 20rem;
      max-width: 100%;
      padding: 0.6rem 0.9rem;
      font-size: 1rem;
      background: #1c1c24;
      border: 1px solid #333;
      border-radius: 0.4rem;
      color: inherit;
      outline: none;
      text-align: center;
      -moz-appearance: textfield;
    }

    #input::-webkit-outer-spin-button,
    #input::-webkit-inner-spin-button { -webkit-appearance: none; }

    #input:focus { border-color: #666; }

    .controls { display: flex; gap: 0.5rem; }

    button {
      padding: 0.5rem 1rem;
      background: #1c1c24;
      border: 1px solid #333;
      border-radius: 0.4rem;
      color: #a0a0b0;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover { background: #2a2a38; color: #e2e2e2; }
    button.active { background: #2a2a38; color: #e2e2e2; border-color: #666; }

    .note { font-size: 0.8rem; color: #555; text-align: center; }
    .note a { color: #7070a0; }
  </style>
</head>
<body>
  <h1>Ithkuil Numeral Generator</h1>

  <div id="output">1</div>

  <input id="input" type="number" value="1" min="0" placeholder="Enter a number...">

  <div class="controls">
    <button id="btn-basic" class="active" onclick="setFont('basic')">Calligraphic</button>
    <button id="btn-flow" onclick="setFont('flow')">Handwritten</button>
    <button onclick="copyOutput()">Copy</button>
  </div>

  <p class="note">Source: <a href="https://v8.zsnout.com/ithkuil/font">v8.zsnout.com/ithkuil/font</a></p>

  <script>
    function convertGroup(n) {
      const ones     = n % 10;
      const tens     = Math.floor(n / 10) % 10;
      const hundreds = Math.floor(n / 100) % 10;
      const thousands = Math.floor(n / 1000) % 10;
      return ones
        + (tens      ? "_" + tens      : "")
        + (hundreds  ? "^" + hundreds  : "")
        + (thousands ? "<" + thousands : "");
    }

    // mirrors numericAdjunctToNumerals: split into base-10000 groups
    function convertNumeral(value) {
      let v = BigInt(Math.floor(Math.abs(Number(value))));
      if (isNaN(Number(v))) return "";
      const groups = [];
      while (v > 0n) {
        groups.unshift(Number(v % 10000n));
        v /= 10000n;
      }
      if (groups.length === 0) groups.push(0);
      return groups.map(convertGroup).join("");
    }

    const output = document.getElementById("output");
    const input  = document.getElementById("input");

    function update() {
      output.textContent = convertNumeral(input.value);
    }

    function setFont(type) {
      document.getElementById("btn-basic").classList.toggle("active", type === "basic");
      document.getElementById("btn-flow").classList.toggle("active", type === "flow");
      output.classList.toggle("flow", type === "flow");
    }

    async function copyOutput() {
      try { await navigator.clipboard.writeText(output.textContent); }
      catch { alert("Copy failed."); }
    }

    input.addEventListener("input", update);
    update();
  </script>
</body>
