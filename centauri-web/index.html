html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

#terminal-overlay {
	position: fixed;
	inset: 0;
	background: #000;
	color: #e8e8e8;
	font-family: 'Courier New', Courier, monospace;
	font-size: 13px;
	line-height: 1.7;
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 9999;
	padding: 40px;
	box-sizing: border-box;
}
#terminal-overlay.hidden { display: none; }
.term-inner { max-width: 560px; width: 100%; }
.term-prompt { color: #555; font-size: 11px; letter-spacing: 1px; margin-bottom: 24px; }
.term-zone { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #666; margin-bottom: 8px; }
.term-msg { font-size: 14px; color: #e8e8e8; margin-bottom: 6px; }
.term-sub { font-size: 12px; color: #555; margin-bottom: 28px; line-height: 1.6; }
.term-sep { border: none; border-top: 1px solid #1a1a1a; margin: 20px 0; }
.term-meta { font-size: 11px; color: #444; margin-bottom: 24px; line-height: 1.8; }
.term-meta span { color: #666; }
.term-ready { font-size: 11px; color: #444; }
.term-cursor { display: inline-block; width: 7px; height: 13px; background: #e8e8e8; vertical-align: middle; animation: blink 1.1s step-end infinite; margin-left: 4px; }
@keyframes blink { 50% { opacity: 0; } }

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

var _WEBGL2_OK = (function () {
	var friendly = [
		'<strong>WebGL2 is blocked in your browser.</strong>',
		'',
		'Privacy-focused browsers (Zen, Comet, Vivaldi, Brave, LibreWolf, etc.) disable WebGL by default to prevent fingerprinting. You need to re-enable it.',
		'',
		'<b>Zen / Firefox / Firefox-based:</b> type <code>about:config</code> in the address bar &rarr; search <code>webgl.disabled</code> &rarr; set it to <code>false</code>.',
		'<b>Brave:</b> go to <code>brave://settings/shields</code> &rarr; turn off <em>Fingerprinting blocking</em> for this site, or use Chrome/Edge instead.',
		'<b>Chrome / Edge:</b> go to <code>chrome://settings/system</code> &rarr; enable <em>Use graphics acceleration when available</em> &rarr; restart.',
		'',
		'Or just open the game in <b>Chrome, Edge, or Safari</b> &mdash; WebGL2 is on by default there.',
	].join('<br>');
	try {
		if (document.createElement('canvas').getContext('webgl2')) { return true; }
	} catch (e) {}
	var overlay = document.getElementById('status');
	var notice = document.getElementById('status-notice');
	overlay.style.visibility = 'visible';
	notice.style.display = 'block';
	notice.innerHTML = friendly;
	return false;
}());
</script>
		<script>
(function () {
	var ZONE_MESSAGES = {
		REMATCH:  { msg: 'Exactly what you encountered before. Every variable identical.', sub: 'Your previous response to this configuration is the baseline.' },
		ECHO:     { msg: 'Your previous session is live. Same terrain, same rules.',       sub: 'New response to a known configuration. Distance from last: minimum.' },
		PARALLEL: { msg: 'The topology is similar. The entry point is not.',               sub: 'Structurally adjacent. Strategically distinct.' },
		SHIFTING: { msg: 'Different map. Related objectives.',                              sub: 'The mode persists. The environment does not.' },
		RADICAL:  { msg: 'New configuration. Distance from last session: maximum.',        sub: 'Maximum prior uncertainty. Maximum expected information gain.' },
	};

	var overlay   = document.getElementById('terminal-overlay');
	var zoneEl    = document.getElementById('term-zone');
	var msgEl     = document.getElementById('term-msg');
	var subEl     = document.getElementById('term-sub');
	var metaEl    = document.getElementById('term-meta');

	// Extract roomId from URL path: /centauri/<roomId>
	var roomId = (function () {
		var parts = window.location.pathname.replace(/\/+$/, '').split('/');
		var idx = parts.indexOf('centauri');
		return (idx >= 0 && parts[idx + 1]) ? parts[idx + 1] : null;
	}());

	var _gameStartFn = null; // holds the deferred startGame call

	function launchGame() {
		overlay.classList.add('hidden');
		if (_gameStartFn) _gameStartFn();
	}

	function renderTerminal(t) {
		var z = ZONE_MESSAGES[t.zone] || {};
		zoneEl.textContent = t.zone ? ('zone · ' + t.zone) : 'session';
		msgEl.textContent  = z.msg  || 'Preparing session.';
		subEl.textContent  = z.sub  || '';

		var lines = [];
		if (t.session_number != null) lines.push('session <span>' + t.session_number + '</span>');
		if (t.has_bot)                lines.push('opponent <span>present</span>');
		metaEl.innerHTML = lines.join('&nbsp;&nbsp;·&nbsp;&nbsp;');

		overlay.classList.remove('hidden');
		document.addEventListener('keydown', function onKey(e) {
			if (e.key === 'Enter') { document.removeEventListener('keydown', onKey); launchGame(); }
		});
	}

	// Fetch terminal data and either show overlay or start immediately
	window._terminalReady = function (startFn) {
		_gameStartFn = startFn;
		if (!roomId) { startFn(); return; }
		fetch('/api/rooms/' + roomId + '/terminal')
			.then(function (r) { return r.json(); })
			.then(function (data) {
				if (data && data.terminal && data.terminal.zone) {
					renderTerminal(data.terminal);
				} else {
					startFn();
				}
			})
			.catch(function () { startFn(); });
	};
}());
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17936176,"index.wasm":43016933},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = _WEBGL2_OK ? new Engine(GODOT_CONFIG) : null;

if (_WEBGL2_OK) (function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				navigator.serviceWorker.getRegistration().then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).catch((err) => {
				console.error('Error while registering service worker:', err);
			}).then(() => {
				window.location.reload();
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		// Gate game start behind terminal overlay (shows zone message when compiler has run)
		window._terminalReady(function () {
			setStatusMode('progress');
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		});
	}
}()); // end _WEBGL2_OK guard
		</script>
