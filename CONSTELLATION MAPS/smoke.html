<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Liquid Smoke Effect</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000; /* Dark background */
        }
        canvas {
            display: block;
            /* These CSS filters are key to the "liquidy" effect */
            /* Blur merges the particles, and contrast sharpens the edges */
            filter: blur(25px) contrast(40);
        }
    </style>
</head>
<body>
    <canvas id="smoke-canvas"></canvas>

    <script>
        const canvas = document.getElementById('smoke-canvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- Configuration ---
        const PARTICLE_COUNT = 50; // Number of smoke particles
        const PARTICLE_RADIUS_MIN = 80; // Minimum particle size
        const PARTICLE_RADIUS_MAX = 150; // Maximum particle size
        const PARTICLE_SPEED = 0.3; // How fast particles move

        // An array to hold all our smoke particles
        let particles = [];

        // --- Particle Class ---
        // Defines a single smoke particle's properties and behavior
        class Particle {
            constructor() {
                // Start position at the center
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                
                // Randomize radius for variety
                this.radius = Math.random() * (PARTICLE_RADIUS_MAX - PARTICLE_RADIUS_MIN) + PARTICLE_RADIUS_MIN;
                
                // Set a random angle and velocity for movement
                this.angle = Math.random() * 2 * Math.PI;
                this.vx = (Math.random() - 0.5) * PARTICLE_SPEED;
                this.vy = (Math.random() - 0.5) * PARTICLE_SPEED;
                
                // Blue color with some transparency
                this.color = `rgba(0, 100, 255, 0.5)`; 
            }

            // Update particle's position each frame
            update() {
                this.x += this.vx + Math.cos(this.angle) * 0.5;
                this.y += this.vy + Math.sin(this.angle) * 0.5;
                this.angle += 0.02;

                // Reset particle if it goes off-screen
                if (this.x - this.radius > canvas.width || this.x + this.radius < 0 || this.y - this.radius > canvas.height || this.y + this.radius < 0) {
                    this.x = canvas.width / 2;
                    this.y = canvas.height / 2;
                }
            }

            // Draw the particle on the canvas
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        // --- Animation Loop ---
        function animate() {
            // Clear the canvas for the next frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw each particle
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // Loop the animation
            requestAnimationFrame(animate);
        }

        // --- Initialization ---
        function init() {
            // Create the particles
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
            // Start the animation loop
            animate();
        }

        // Handle window resizing
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start the effect
        init();
    </script>
</body>
</html>
