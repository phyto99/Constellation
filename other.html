<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nakama Lobby System</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/colyseus.js@0.15.24/dist/colyseus.js"></script>

</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const NakamaLobbySystem = () => {
      const [view, setView] = useState('main');
      const [lobbies, setLobbies] = useState([]);
      const [currentLobby, setCurrentLobby] = useState(null);
      const [playerName, setPlayerName] = useState('');
      const [isConnected, setIsConnected] = useState(false);
      const [viewAsPlayer, setViewAsPlayer] = useState('host');
      const [errorMessage, setErrorMessage] = useState('');
      const [serverStatus, setServerStatus] = useState('checking');
      const [lastCheckTime, setLastCheckTime] = useState(0);
      const [errorLog, setErrorLog] = useState([]);
      
      // Colyseus state
      const [colyseusClient, setColyseusClient] = useState(null);
      const [room, setRoom] = useState(null);
      const [playerCursors, setPlayerCursors] = useState({});
      const [mySessionId, setMySessionId] = useState(null);
      const canvasRef = useRef(null);

      // Activity logging helper - logs everything (not just errors)
      const logActivity = (context, message, isError = false) => {
        const timestamp = new Date().toLocaleTimeString();
        const logMsg = `[${timestamp}] ${context}: ${message}`;
        console.log(logMsg);
        setErrorLog(prev => [...prev, { msg: logMsg, isError }].slice(-15)); // Keep last 15 logs
      };

      // Check server status periodically
      useEffect(() => {
        let checkCount = 0;
        
        const checkServer = async () => {
          checkCount++;
          setLastCheckTime(checkCount);
          
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);
            
            const response = await fetch('http://localhost:2567/health', {
              signal: controller.signal,
              cache: 'no-cache'
            });
            
            clearTimeout(timeoutId);
            
            if (response.ok) {
              const data = await response.json();
              if (data.status === 'ok') {
                setServerStatus('online');
              } else {
                setServerStatus('error');
              }
            } else {
              setServerStatus('error');
            }
          } catch (error) {
            console.log('Server check failed:', error.message);
            setServerStatus('offline');
          }
        };

        checkServer();
        const interval = setInterval(checkServer, 3000); // Check every 3 seconds
        return () => clearInterval(interval);
      }, []);
      
      const [lobbyConfig, setLobbyConfig] = useState({
        name: 'My Game Room',
        maxPlayers: 4,
        isPrivate: false,
        gameMode: 'competitive',
        allowTeamSwitching: true,
        showSettingsToPlayers: true,
        moves: 15,
        rounds: 10,
        roundLength: 30,
        planningTime: 5,
        steals: 15,
        headquarters: 2,
        multipliers: {
          count: 500,
          distance: 1,
          hq: 10,
          destruction: 1
        },
        aiBots: []
      });

      const [lobbyPlayers, setLobbyPlayers] = useState([]);
      const [draggedPlayer, setDraggedPlayer] = useState(null);
      const [readyPlayers, setReadyPlayers] = useState(new Set());

      const TEAM_CONFIGS = [
        { color: '#00FFFF', name: 'CYAN' },
        { color: '#FF00FF', name: 'MAGENTA' },
        { color: '#00FF00', name: 'LIME' },
        { color: '#FFD700', name: 'GOLD' },
        { color: '#0000FF', name: 'BLUE' },
        { color: '#FF0000', name: 'RED' },
        { color: '#006400', name: 'DARK GREEN' }
      ];

      const UNASSIGNED_TEAM = { color: '#808080', name: 'UNASSIGNED' };

      const AI_BOT_TYPES = {
        HAL: { name: 'HAL', description: 'Steady and logical' },
        CAESAR: { name: 'CAESAR', description: 'Tactical' },
        ATHENA: { name: 'ATHENA', description: 'Aggressive' },
        ROBIN_HOOD: { name: 'ROBIN HOOD', description: 'Opportunist' },
        EINSTEIN: { name: 'EINSTEIN', description: 'Wormhole' },
        LORENZ: { name: 'LORENZ', description: 'Chaotic' }
      };

      const connectToColyseus = async () => {
        try {
          setErrorMessage('');
          console.log('Connecting to ws://localhost:2567...');
          
          // Check if Colyseus is loaded
          if (typeof Colyseus === 'undefined') {
            throw new Error('Colyseus library not loaded. Check your internet connection.');
          }
          
          const client = new Colyseus.Client('ws://localhost:2567');
          
          // Test connection with timeout
          console.log('Testing connection...');
          const timeoutPromise = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Connection timeout')), 5000)
          );
          
          await Promise.race([
            client.getAvailableRooms('constellation'),
            timeoutPromise
          ]);
          
          setColyseusClient(client);
          setIsConnected(true);
          setServerStatus('online');
          console.log('✓ Connected successfully!');
          loadLobbies();
        } catch (error) {
          console.error('✗ Failed to connect:', error);
          logActivity('Connect', `✗ ERROR: ${error.message}`, true);
          setServerStatus('offline');
          const errorMsg = 'Failed to connect: ' + error.message;
          setErrorMessage(errorMsg);
        }
      };

      const loadLobbies = async () => {
        if (!colyseusClient) return;
        
        try {
          const availableRooms = await colyseusClient.getAvailableRooms('constellation');
          const formattedLobbies = availableRooms.map(room => ({
            id: room.roomId,
            name: room.metadata?.name || `Game ${room.roomId}`,
            host: room.metadata?.hostName || 'Unknown',
            players: room.clients,
            maxPlayers: room.maxClients,
            mode: room.metadata?.gameMode || 'competitive',
            status: room.metadata?.gameState || 'waiting'
          }));
          setLobbies(formattedLobbies);
        } catch (error) {
          console.error('Failed to load lobbies:', error);
          setLobbies([]);
        }
      };

      const getNextBalancedTeam = (players, maxPlayers) => {
        const teamCounts = {};
        for (let i = 0; i < maxPlayers; i++) {
          teamCounts[i] = players.filter(p => p.teamIndex === i).length;
        }
        let minTeam = 0;
        let minCount = teamCounts[0];
        for (let i = 1; i < maxPlayers; i++) {
          if (teamCounts[i] < minCount) {
            minCount = teamCounts[i];
            minTeam = i;
          }
        }
        return minTeam;
      };

      const createLobby = async () => {
        try {
          setErrorMessage('');
          console.log('Creating lobby:', lobbyConfig.name);
          logActivity('Create Lobby', `Creating room: ${lobbyConfig.name}`);
          
          const roomInstance = await colyseusClient.create('constellation', {
            name: lobbyConfig.name,
            maxPlayers: lobbyConfig.maxPlayers,
            gameMode: lobbyConfig.gameMode,
            hostName: playerName,
            ...lobbyConfig
          });
          
          console.log('✓ Room created:', roomInstance.roomId);
          logActivity('Create Lobby', `✓ Room ${roomInstance.roomId} created`);
          
          setRoom(roomInstance);
          setMySessionId(roomInstance.sessionId);
          
          const newLobby = {
            id: roomInstance.roomId,
            name: lobbyConfig.name,
            host: playerName,
            players: 1,
            maxPlayers: lobbyConfig.maxPlayers,
            mode: lobbyConfig.gameMode,
            status: 'waiting',
            config: lobbyConfig
          };
          
          const initialPlayers = [
            { id: roomInstance.sessionId, name: playerName, teamIndex: 0, isHost: true, isAI: false }
          ];
          
          lobbyConfig.aiBots.forEach((bot, idx) => {
            const teamIndex = getNextBalancedTeam(initialPlayers, lobbyConfig.maxPlayers);
            initialPlayers.push({
              id: `ai_${bot.id}`,
              name: AI_BOT_TYPES[bot.type].name,
              teamIndex: teamIndex,
              isHost: false,
              isAI: true,
              botType: bot.type,
              aggression: bot.aggression
            });
          });
          
          setLobbyPlayers(initialPlayers);
          setCurrentLobby(newLobby);
          setupRoomListeners(roomInstance);
          setView('lobby');
        } catch (error) {
          console.error('✗ Failed to create lobby:', error);
          logActivity('Create Lobby', `✗ ERROR: ${error.message}`, true);
          setErrorMessage('Failed to create lobby: ' + error.message);
        }
      };

      const joinLobby = async (lobby) => {
        try {
          setErrorMessage('');
          logActivity('Join Lobby', `Attempting to join room ${lobby.id}`);
          console.log('Joining lobby:', lobby.id, 'with name:', playerName);
          
          if (!colyseusClient) {
            throw new Error('Not connected to server. Click CONNECT first.');
          }
          
          const roomInstance = await colyseusClient.joinById(lobby.id, { name: playerName });
          
          console.log('✓ Joined room:', roomInstance.sessionId);
          logActivity('Join Lobby', `✓ Joined as ${roomInstance.sessionId}`);
          
          setRoom(roomInstance);
          setMySessionId(roomInstance.sessionId);
          setCurrentLobby(lobby);
          setViewAsPlayer(roomInstance.sessionId);
          setupRoomListeners(roomInstance);
          
          // Initialize players from room state
          updatePlayersFromRoomState(roomInstance);
          
          setView('lobby');
        } catch (error) {
          console.error('✗ Failed to join lobby:', error);
          logActivity('Join Lobby', `✗ ERROR: ${error.message}`, true);
          setErrorMessage('Failed to join lobby: ' + error.message);
        }
      };

      const setupRoomListeners = (roomInstance) => {
        // Listen for player state changes
        roomInstance.state.players.onAdd = (player, sessionId) => {
          console.log('Player added:', sessionId, player);
          logActivity('Room Event', `Player ${player.name} joined`);
          updatePlayersFromRoomState(roomInstance);
        };
        
        roomInstance.state.players.onRemove = (player, sessionId) => {
          console.log('Player removed:', sessionId);
          logActivity('Room Event', `Player ${sessionId} left`);
          updatePlayersFromRoomState(roomInstance);
        };
        
        roomInstance.state.players.onChange = (player, sessionId) => {
          console.log('Player changed:', sessionId, player);
          logActivity('Room Event', `Player ${player.name} updated`);
          updatePlayersFromRoomState(roomInstance);
        };
        
        // Listen for cursor movements
        roomInstance.onMessage('cursor_move', (data) => {
          setPlayerCursors(prev => ({
            ...prev,
            [data.sessionId]: {
              x: data.x,
              y: data.y,
              color: data.color,
              name: data.name
            }
          }));
        });
        
        // Listen for team changes
        roomInstance.onMessage('player_team_changed', (data) => {
          console.log('Team changed:', data);
          logActivity('Room Event', `Player moved to team ${data.newTeam}`);
          updatePlayersFromRoomState(roomInstance);
        });
        
        // Listen for game start
        roomInstance.onMessage('game_started', (data) => {
          console.log('Game started:', data);
          logActivity('Room Event', 'Game started!');
          setView('game');
        });
      };
      
      const updatePlayersFromRoomState = (roomInstance) => {
        const players = [];
        roomInstance.state.players.forEach((player, sessionId) => {
          players.push({
            id: sessionId,
            name: player.name,
            teamIndex: player.team !== null ? player.team : 0,
            isHost: sessionId === roomInstance.sessionId,
            isAI: false,
            ready: player.ready
          });
        });
        setLobbyPlayers(players);
      };
      
      const startGame = () => {
        if (room) {
          console.log('Starting game, redirecting to index.html with room ID');
          logActivity('Start Game', `Redirecting to index.html?room=${room.roomId}`);
          room.send('start_game');
          // Redirect to index.html with room ID as query parameter
          window.location.href = `/index.html?room=${room.roomId}`;
        } else {
          console.error('No room connection');
          logActivity('Start Game', '✗ ERROR: No room connection available', true);
          setErrorMessage('No room connection available');
        }
      };

      const addAIBot = () => {
        const newBot = {
          id: Date.now(),
          type: 'HAL',
          teamIndex: -1,
          aggression: 0.5
        };
        setLobbyConfig({
          ...lobbyConfig,
          aiBots: [...lobbyConfig.aiBots, newBot]
        });
      };

      const removeAIBot = (botId) => {
        setLobbyConfig({
          ...lobbyConfig,
          aiBots: lobbyConfig.aiBots.filter(bot => bot.id !== botId)
        });
      };

      const updateAIBot = (botId, field, value) => {
        setLobbyConfig({
          ...lobbyConfig,
          aiBots: lobbyConfig.aiBots.map(bot =>
            bot.id === botId ? { ...bot, [field]: value } : bot
          )
        });
      };

      const changePlayerTeam = (playerId, newTeamIndex) => {
        if (room) {
          room.send('join_team', { teamIndex: newTeamIndex });
        }
        setLobbyPlayers(lobbyPlayers.map(p => 
          p.id === playerId ? { ...p, teamIndex: newTeamIndex } : p
        ));
      };

      const randomizeTeams = () => {
        const shuffled = [...lobbyPlayers];
        const teamsCount = Math.min(currentLobby.maxPlayers, TEAM_CONFIGS.length);
        
        shuffled.forEach((player, idx) => {
          player.teamIndex = idx % teamsCount;
        });
        
        setLobbyPlayers(shuffled);
        setLobbyConfig({ ...lobbyConfig, allowTeamSwitching: false });
      };

      const handleDragStart = (e, player) => {
        const currentPlayer = lobbyPlayers.find(p => 
          isHost() ? p.id === 'host' : p.id === viewAsPlayer
        );
        
        if (!(viewAsPlayer === 'host' || (player.id === currentPlayer?.id && canSwitchTeams()))) {
          e.preventDefault();
          return;
        }
        
        setDraggedPlayer(player);
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', player.id);
      };

      const handleDragEnd = () => {
        setDraggedPlayer(null);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = (e, teamIndex) => {
        e.preventDefault();
        if (draggedPlayer) {
          const currentPlayer = lobbyPlayers.find(p => 
            isHost() ? p.id === 'host' : p.id === viewAsPlayer
          );
          
          if (viewAsPlayer === 'host' || (draggedPlayer.id === currentPlayer?.id && canSwitchTeams())) {
            changePlayerTeam(draggedPlayer.id, teamIndex);
          }
        }
        setDraggedPlayer(null);
      };

      const isHost = () => viewAsPlayer === mySessionId || viewAsPlayer === 'host';
      const canSwitchTeams = () => lobbyConfig.allowTeamSwitching || isHost();

      const toggleReady = (playerId) => {
        setReadyPlayers(prev => {
          const newSet = new Set(prev);
          if (newSet.has(playerId)) {
            newSet.delete(playerId);
          } else {
            newSet.add(playerId);
          }
          return newSet;
        });
      };

      // Main Menu
      const MainMenuView = () => {
        return (
          <div className="min-h-screen bg-black flex items-center justify-center p-4">
            <div className="border border-white p-8 max-w-md w-full">
              <div className="text-center mb-8">
                <div className="w-16 h-16 border-2 border-white mx-auto mb-4" />
                <h1 className="text-4xl font-bold text-white mb-2">STAR CONQUEST</h1>
                <p className="text-white text-sm tracking-widest">MULTIPLAYER</p>
              </div>

              {/* Error Message Display */}
              {errorMessage && (
                <div className="mb-4 p-3 border-2 border-red-500 bg-red-900 bg-opacity-20">
                  <div className="text-red-500 text-sm font-bold uppercase tracking-wider mb-1">ERROR</div>
                  <div className="text-red-400 text-sm">{errorMessage}</div>
                </div>
              )}

            {!isConnected ? (
              <div className="space-y-4">
                <div>
                  <label className="block text-xs text-white mb-2 uppercase tracking-wider">Name</label>
                  <input
                    type="text"
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && playerName) {
                        e.preventDefault();
                        connectToColyseus();
                      }
                    }}
                    className="w-full px-4 py-3 bg-black border border-white text-white focus:outline-none"
                    placeholder="ENTER NAME"
                    autoFocus
                  />
                </div>
                <button
                  onClick={(e) => {
                    e.preventDefault();
                    if (!playerName) {
                      logActivity('Connect', '✗ ERROR: Please enter your name', true);
                      return;
                    }
                    if (serverStatus !== 'online') {
                      logActivity('Connect', '✗ ERROR: Server is offline', true);
                      return;
                    }
                    connectToColyseus();
                  }}
                  disabled={!playerName || serverStatus !== 'online'}
                  className="w-full py-3 bg-white text-black font-bold hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed uppercase tracking-wider transition-colors"
                >
                  CONNECT
                </button>
                {serverStatus === 'offline' && (
                  <div className="text-red-500 text-xs text-center uppercase tracking-wider">
                    Server is offline. Start server with: npm start
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-3">
                <div className="flex items-center gap-2 text-green-500 text-xs mb-4 uppercase tracking-wider">
                  <div className="w-2 h-2 bg-green-500" />
                  CONNECTED: {playerName}
                </div>
                <button
                  onClick={() => { createLobby(); setViewAsPlayer('host'); }}
                  className="w-full py-3 bg-white text-black font-bold hover:bg-gray-200 uppercase tracking-wider transition-colors"
                >
                  CREATE GAME
                </button>
                <button
                  onClick={() => setView('browse')}
                  className="w-full py-3 bg-black text-white border border-white font-bold hover:bg-white hover:text-black uppercase tracking-wider transition-colors"
                >
                  BROWSE LOBBIES
                </button>
              </div>
            )}
            </div>
          </div>
        );
      };

      // Browse Lobbies
      const BrowseLobbiesView = () => {
        // Auto-refresh when view opens
        useEffect(() => {
          if (view === 'browse') {
            loadLobbies();
          }
        }, [view]);

        return (
          <div className="min-h-screen bg-black p-4">
            <div className="max-w-6xl mx-auto py-8">
              <button
                onClick={() => setView('main')}
                className="mb-6 text-white hover:text-gray-400 uppercase tracking-wider text-xs"
              >
                ← BACK
              </button>

            <div className="border border-white p-8">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-3xl font-bold text-white uppercase tracking-wider">LOBBIES</h2>
                <button
                  onClick={loadLobbies}
                  className="px-4 py-2 bg-white text-black hover:bg-gray-300 uppercase tracking-wider text-xs"
                >
                  REFRESH
                </button>
              </div>

              <div className="space-y-4">
                {lobbies.map(lobby => (
                  <div
                    key={lobby.id}
                    className="border border-white p-6 hover:bg-white hover:bg-opacity-5"
                  >
                    <div className="flex justify-between items-start">
                      <div className="flex-1">
                        <div className="flex items-center gap-3 mb-2">
                          <h3 className="text-xl font-bold text-white uppercase tracking-wider">{lobby.name}</h3>
                          <span className="px-2 py-1 border border-green-500 text-green-500 text-xs uppercase">
                            {lobby.status}
                          </span>
                        </div>
                        <div className="flex items-center gap-6 text-sm text-white uppercase tracking-wider">
                          <div>HOST: {lobby.host}</div>
                          <div>PLAYERS: {lobby.players}/{lobby.maxPlayers}</div>
                          <div>MODE: {lobby.mode}</div>
                        </div>
                      </div>
                      {lobby.status === 'waiting' && (
                        <button
                          onClick={() => {
                            if (!isConnected) {
                              logActivity('Join', '✗ ERROR: Not connected. Click CONNECT first.', true);
                              return;
                            }
                            joinLobby(lobby);
                          }}
                          className="px-6 py-2 bg-white text-black font-bold hover:bg-gray-300 uppercase tracking-wider"
                        >
                          JOIN
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
        );
      };

      // Lobby Waiting Room
      const LobbyView = () => {
        const currentPlayer = lobbyPlayers.find(p => p.id === mySessionId);

        return (
          <div className="min-h-screen bg-black p-4">
            <div className="max-w-7xl mx-auto py-8">
              <div className="mb-6 flex items-center gap-4">
                <button
                  onClick={() => setView('browse')}
                  className="text-white hover:text-gray-400 uppercase tracking-wider text-xs"
                >
                  ← LEAVE
                </button>
                <div className="flex-1" />
                {mySessionId && (
                  <div className="flex gap-2 border border-white p-2">
                    <span className="text-white text-xs uppercase tracking-wider mr-2">VIEW AS:</span>
                    {lobbyPlayers.map(player => (
                      <button
                        key={player.id}
                        onClick={() => setViewAsPlayer(player.id)}
                        className={`px-3 py-1 text-xs uppercase tracking-wider ${
                          viewAsPlayer === player.id
                            ? 'bg-white text-black'
                            : 'text-white hover:bg-white hover:bg-opacity-10'
                        }`}
                      >
                        {player.id === mySessionId ? 'YOU' : player.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>

              <div className="grid lg:grid-cols-4 gap-6">
                {isHost() && (
                  <div className="lg:col-span-1 border border-white p-6 space-y-6">
                    <h3 className="text-xl font-bold text-white uppercase tracking-wider mb-4">HOST SETTINGS</h3>
                    
                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs text-white mb-2 uppercase tracking-wider">Name</label>
                        <input
                          type="text"
                          value={lobbyConfig.name}
                          onChange={(e) => setLobbyConfig({ ...lobbyConfig, name: e.target.value })}
                          className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                        />
                      </div>
                      
                      <div>
                        <label className="block text-xs text-white mb-2 uppercase tracking-wider">Mode</label>
                        <select
                          value={lobbyConfig.gameMode}
                          onChange={(e) => setLobbyConfig({ ...lobbyConfig, gameMode: e.target.value })}
                          className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                        >
                          <option value="competitive">COMPETITIVE</option>
                          <option value="teams">TEAMS</option>
                          <option value="collaborative">COLLABORATIVE</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-white mb-2 uppercase tracking-wider">Moves</label>
                          <input
                            type="number"
                            value={lobbyConfig.moves}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, moves: parseInt(e.target.value) })}
                            className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-white mb-2 uppercase tracking-wider">Rounds</label>
                          <input
                            type="number"
                            value={lobbyConfig.rounds}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, rounds: parseInt(e.target.value) })}
                            className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-white mb-2 uppercase tracking-wider">Time</label>
                          <input
                            type="number"
                            value={lobbyConfig.roundLength}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, roundLength: parseInt(e.target.value) })}
                            className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-white mb-2 uppercase tracking-wider">Steals</label>
                          <input
                            type="number"
                            value={lobbyConfig.steals}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, steals: parseInt(e.target.value) })}
                            className="w-full px-3 py-2 bg-black border border-white text-white text-sm focus:outline-none"
                          />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <div className="flex items-center gap-2">
                          <input
                            type="checkbox"
                            checked={lobbyConfig.allowTeamSwitching}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, allowTeamSwitching: e.target.checked })}
                            className="w-4 h-4"
                          />
                          <label className="text-white uppercase tracking-wider text-xs">ALLOW TEAM SWITCHING</label>
                        </div>
                        <div className="flex items-center gap-2">
                          <input
                            type="checkbox"
                            checked={lobbyConfig.showSettingsToPlayers}
                            onChange={(e) => setLobbyConfig({ ...lobbyConfig, showSettingsToPlayers: e.target.checked })}
                            className="w-4 h-4"
                          />
                          <label className="text-white uppercase tracking-wider text-xs">SHOW SETTINGS TO PLAYERS</label>
                        </div>
                      </div>
                    </div>

                    <div>
                      <h4 className="text-sm font-bold text-white mb-3 uppercase tracking-wider">AI BOTS</h4>
                      <div className="space-y-2">
                        {lobbyConfig.aiBots.map(bot => (
                          <div key={bot.id} className="border border-white p-2">
                            <div className="flex gap-2 items-center text-xs">
                              <select
                                value={bot.type}
                                onChange={(e) => {
                                  updateAIBot(bot.id, 'type', e.target.value);
                                  setLobbyPlayers(lobbyPlayers.map(p => 
                                    p.id === `ai_${bot.id}` ? { ...p, name: AI_BOT_TYPES[e.target.value].name, botType: e.target.value } : p
                                  ));
                                }}
                                className="flex-1 px-2 py-1 bg-black border border-white text-white uppercase"
                              >
                                {Object.keys(AI_BOT_TYPES).map(key => (
                                  <option key={key} value={key}>{AI_BOT_TYPES[key].name}</option>
                                ))}
                              </select>
                              <button
                                onClick={() => {
                                  removeAIBot(bot.id);
                                  setLobbyPlayers(lobbyPlayers.filter(p => p.id !== `ai_${bot.id}`));
                                }}
                                className="px-2 py-1 bg-white text-black hover:bg-gray-300 uppercase"
                              >
                                X
                              </button>
                            </div>
                          </div>
                        ))}
                        <button
                          onClick={() => {
                            const newBot = {
                              id: Date.now(),
                              type: 'HAL',
                              teamIndex: 0,
                              aggression: 0.5
                            };
                            const balancedTeam = getNextBalancedTeam(lobbyPlayers, currentLobby.maxPlayers);
                            addAIBot();
                            setLobbyPlayers([...lobbyPlayers, {
                              id: `ai_${newBot.id}`,
                              name: AI_BOT_TYPES[newBot.type].name,
                              teamIndex: balancedTeam,
                              isHost: false,
                              isAI: true,
                              botType: newBot.type,
                              aggression: newBot.aggression
                            }]);
                          }}
                          className="w-full py-2 bg-black text-white border border-white hover:bg-white hover:text-black uppercase tracking-wider text-xs transition-colors"
                        >
                          + ADD AI
                        </button>
                      </div>
                    </div>

                    <div className="space-y-2 pt-4 border-t border-white">
                      <button
                        onClick={randomizeTeams}
                        className="w-full py-2 bg-black text-white border border-white hover:bg-white hover:text-black uppercase tracking-wider text-xs"
                      >
                        RANDOMIZE TEAMS
                      </button>
                      <button
                        onClick={startGame}
                        className="w-full py-3 bg-green-500 text-black font-bold hover:bg-green-400 uppercase tracking-wider"
                      >
                        START GAME
                      </button>
                    </div>
                  </div>
                )}

                <div className={isHost() ? 'lg:col-span-3' : 'lg:col-span-4'}>
                  <div className="border border-white p-6">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-2xl font-bold text-white uppercase tracking-wider">
                        {currentLobby?.name}
                      </h2>
                      {currentPlayer && (
                        <div className="text-white text-sm uppercase tracking-wider">
                          YOU: <span style={{ color: TEAM_CONFIGS[currentPlayer.teamIndex].color }}>
                            {TEAM_CONFIGS[currentPlayer.teamIndex].name}
                          </span>
                        </div>
                      )}
                    </div>

                    <div className="space-y-1 mb-6">
                      {TEAM_CONFIGS.slice(0, currentLobby?.maxPlayers || 4).map((team, teamIdx) => {
                        const teamPlayers = lobbyPlayers.filter(p => p.teamIndex === teamIdx);
                        
                        return (
                          <div
                            key={teamIdx}
                            onDragOver={handleDragOver}
                            onDrop={(e) => handleDrop(e, teamIdx)}
                            className="border-2 p-2"
                            style={{ borderColor: team.color }}
                          >
                            <div className="flex items-center gap-3">
                              <div
                                className="w-20 h-14 flex-shrink-0"
                                style={{ backgroundColor: team.color }}
                              />
                              
                              <div className="w-28 flex-shrink-0">
                                <div className="text-white text-sm font-bold uppercase tracking-wider">
                                  {team.name}
                                </div>
                              </div>

                              <div className="flex-1 flex gap-2 flex-wrap items-center min-h-[88px]">
                                {teamPlayers.map(player => {
                                  const canDrag = isHost() || (player.id === currentPlayer?.id && canSwitchTeams());
                                  const isBeingDragged = draggedPlayer?.id === player.id;
                                  
                                  return (
                                    <div
                                      key={player.id}
                                      draggable={canDrag}
                                      onDragStart={(e) => handleDragStart(e, player)}
                                      onDragEnd={handleDragEnd}
                                      className={`relative border-2 w-20 h-20 bg-black flex flex-col items-center justify-center ${
                                        canDrag ? 'cursor-move' : 'cursor-default'
                                      }`}
                                      style={{
                                        borderColor: team.color,
                                        opacity: isBeingDragged ? 0.4 : 1
                                      }}
                                    >
                                      <div className={`text-[10px] uppercase tracking-wider text-center px-1 break-words pointer-events-none leading-tight ${
                                        player.isHost ? 'text-yellow-500 font-bold' : 'text-white'
                                      }`}>
                                        {player.name}
                                      </div>
                                      {player.isAI && (
                                        <div className="text-gray-400 text-[9px] uppercase mt-0.5 pointer-events-none">AI</div>
                                      )}
                                      
                                      {readyPlayers.has(player.id) && (
                                        <div 
                                          className="absolute w-4 h-4 flex items-center justify-center pointer-events-none"
                                          style={{ 
                                            backgroundColor: team.color,
                                            bottom: '-1px',
                                            right: '-1px'
                                          }}
                                        >
                                          <svg className="w-3 h-3" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M2 6L5 9L10 3" stroke="black" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                          </svg>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                                
                                {teamPlayers.length === 0 && (
                                  <div className="text-gray-500 text-xs uppercase tracking-wider px-4 pointer-events-none">
                                    EMPTY
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {(!isHost() && lobbyConfig.showSettingsToPlayers) && (
                      <div className="border-t border-white pt-6 mt-6">
                        <h3 className="text-lg font-bold text-white uppercase tracking-wider mb-4">GAME SETTINGS</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-white text-xs uppercase tracking-wider">
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">MODE</div>
                            <div className="font-bold">{lobbyConfig.gameMode}</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">ROUNDS</div>
                            <div className="font-bold">{lobbyConfig.rounds}</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">TIME</div>
                            <div className="font-bold">{lobbyConfig.roundLength * lobbyConfig.rounds}S</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">MOVES</div>
                            <div className="font-bold">{lobbyConfig.moves}</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">STEALS</div>
                            <div className="font-bold">{lobbyConfig.steals}</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">HEADQUARTERS</div>
                            <div className="font-bold">{lobbyConfig.headquarters}</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">PLANNING</div>
                            <div className="font-bold">{lobbyConfig.planningTime}S</div>
                          </div>
                          <div className="border border-white p-3">
                            <div className="text-gray-400 mb-1">TEAM SWITCH</div>
                            <div className="font-bold">{lobbyConfig.allowTeamSwitching ? 'YES' : 'NO'}</div>
                          </div>
                        </div>
                        
                        <div className="mt-4">
                          <h4 className="text-sm font-bold text-white uppercase tracking-wider mb-3">MULTIPLIERS</h4>
                          <div className="grid grid-cols-4 gap-4 text-white text-xs uppercase tracking-wider">
                            {Object.entries(lobbyConfig.multipliers).map(([key, value]) => (
                              <div key={key} className="border border-white p-3">
                                <div className="text-gray-400 mb-1">{key}</div>
                                <div className="font-bold">{value}X</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                    
                    {(!isHost() && !lobbyConfig.showSettingsToPlayers) && (
                      <div className="border-t border-white pt-6 mt-6">
                        <div className="text-center text-white text-sm uppercase tracking-wider">
                          WAITING FOR HOST TO START GAME
                        </div>
                      </div>
                    )}

                    {!isHost() && currentPlayer && (
                      <div className="border-t border-white pt-6 mt-6">
                        <button
                          onClick={() => toggleReady(currentPlayer.id)}
                          className={`w-full py-3 font-bold uppercase tracking-wider ${
                            readyPlayers.has(currentPlayer.id)
                              ? 'bg-green-500 text-black hover:bg-green-400'
                              : 'bg-black text-white border border-white hover:bg-white hover:text-black'
                          }`}
                        >
                          {readyPlayers.has(currentPlayer.id) ? '✓ READY' : 'Ready to START?'}
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // Game View with Constellation Canvas
      const GameView = () => {
        const [stars, setStars] = useState([]);
        const [myTeamMoves, setMyTeamMoves] = useState(0);
        const [totalTeamMoves, setTotalTeamMoves] = useState(0);
        const [myMovesUsed, setMyMovesUsed] = useState(0);
        
        useEffect(() => {
          // Generate random stars for constellation
          const generatedStars = Array.from({ length: 50 }, (_, i) => ({
            id: i,
            x: Math.random() * 800,
            y: Math.random() * 600,
            owner: null
          }));
          setStars(generatedStars);
          
          // Calculate move allocation
          const currentPlayer = lobbyPlayers.find(p => p.id === mySessionId);
          if (currentPlayer) {
            const teamPlayers = lobbyPlayers.filter(p => p.teamIndex === currentPlayer.teamIndex && !p.isAI);
            const totalMoves = lobbyConfig.moves || 12;
            const movesPerPlayer = Math.floor(totalMoves / teamPlayers.length);
            setMyTeamMoves(movesPerPlayer);
            setTotalTeamMoves(totalMoves);
          }
          
          // Setup canvas mouse tracking
          const canvas = canvasRef.current;
          if (canvas && room) {
            const handleMouseMove = (e) => {
              const rect = canvas.getBoundingClientRect();
              const x = e.clientX - rect.left;
              const y = e.clientY - rect.top;
              
              const currentPlayer = lobbyPlayers.find(p => p.id === mySessionId);
              const teamColor = currentPlayer ? TEAM_CONFIGS[currentPlayer.teamIndex].color : '#FFFFFF';
              
              room.send('cursor_move', {
                x,
                y,
                color: teamColor,
                name: playerName
              });
            };
            
            canvas.addEventListener('mousemove', handleMouseMove);
            return () => canvas.removeEventListener('mousemove', handleMouseMove);
          }
        }, [room, mySessionId, lobbyPlayers]);
        
        const currentPlayer = lobbyPlayers.find(p => p.id === mySessionId);
        const teamColor = currentPlayer ? TEAM_CONFIGS[currentPlayer.teamIndex].color : '#FFFFFF';
        const teamName = currentPlayer ? TEAM_CONFIGS[currentPlayer.teamIndex].name : 'UNKNOWN';
        
        return (
          <div className="min-h-screen bg-black p-4">
            <div className="max-w-7xl mx-auto">
              {/* Header with move allocation */}
              <div className="border border-white p-4 mb-4 flex justify-between items-center">
                <div className="text-white">
                  <span className="uppercase tracking-wider text-sm">YOUR TEAM: </span>
                  <span className="font-bold uppercase tracking-wider" style={{ color: teamColor }}>
                    {teamName}
                  </span>
                </div>
                <div className="text-white">
                  <span className="uppercase tracking-wider text-sm">YOUR MOVES: </span>
                  <span className="font-bold text-xl" style={{ color: teamColor }}>
                    {myMovesUsed}/{myTeamMoves}
                  </span>
                  <span className="text-gray-500 text-sm ml-2">
                    (Team Total: {totalTeamMoves})
                  </span>
                </div>
              </div>
              
              {/* Game Canvas */}
              <div className="border border-white relative" style={{ width: '800px', height: '600px', margin: '0 auto' }}>
                <canvas
                  ref={canvasRef}
                  width={800}
                  height={600}
                  className="bg-black"
                  style={{ display: 'block' }}
                />
                
                {/* Render multiplayer cursors */}
                {Object.entries(playerCursors).map(([sessionId, cursor]) => {
                  if (sessionId === mySessionId) return null;
                  
                  return (
                    <div
                      key={sessionId}
                      className="absolute pointer-events-none"
                      style={{
                        left: cursor.x,
                        top: cursor.y,
                        transform: 'translate(-50%, -50%)'
                      }}
                    >
                      {/* Cursor pointer */}
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path
                          d="M5 3L19 12L12 13L9 20L5 3Z"
                          fill={cursor.color}
                          stroke="white"
                          strokeWidth="1"
                        />
                      </svg>
                      {/* Player name label */}
                      <div
                        className="text-xs font-bold uppercase tracking-wider whitespace-nowrap px-2 py-1 rounded"
                        style={{
                          backgroundColor: cursor.color,
                          color: 'black',
                          marginTop: '4px'
                        }}
                      >
                        {cursor.name}
                      </div>
                    </div>
                  );
                })}
                
                {/* Render stars on canvas */}
                <svg
                  width={800}
                  height={600}
                  className="absolute top-0 left-0 pointer-events-none"
                >
                  {stars.map(star => (
                    <circle
                      key={star.id}
                      cx={star.x}
                      cy={star.y}
                      r={4}
                      fill={star.owner ? TEAM_CONFIGS[star.owner].color : 'white'}
                      stroke="white"
                      strokeWidth={1}
                    />
                  ))}
                </svg>
              </div>
              
              {/* Team players sidebar */}
              <div className="border border-white p-4 mt-4">
                <h3 className="text-white font-bold uppercase tracking-wider mb-3">TEAM PLAYERS</h3>
                <div className="grid grid-cols-4 gap-2">
                  {lobbyPlayers
                    .filter(p => p.teamIndex === currentPlayer?.teamIndex)
                    .map(player => (
                      <div
                        key={player.id}
                        className="border-2 p-2 text-center"
                        style={{ borderColor: teamColor }}
                      >
                        <div className="text-white text-xs uppercase tracking-wider">
                          {player.name}
                        </div>
                        <div className="text-xs text-gray-400 mt-1">
                          {player.id === mySessionId ? 'YOU' : 'TEAMMATE'}
                        </div>
                        <div className="text-xs font-bold mt-1" style={{ color: teamColor }}>
                          {myTeamMoves} MOVES
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // Persistent Server Status Display
      const ServerStatusDisplay = () => {
        const getStatusColor = () => {
          switch (serverStatus) {
            case 'online': return 'bg-green-500';
            case 'offline': return 'bg-red-500';
            case 'error': return 'bg-yellow-500';
            default: return 'bg-gray-500';
          }
        };

        const getStatusText = () => {
          switch (serverStatus) {
            case 'online': return 'ONLINE';
            case 'offline': return 'OFFLINE';
            case 'error': return 'ERROR';
            default: return 'CHECKING';
          }
        };

        return (
          <>
            {/* Server Status - Bottom Right */}
            <div className="fixed bottom-4 right-4 bg-black border-2 border-white p-3 z-50">
              <div className="flex items-center gap-2 mb-1">
                <div className={`w-2 h-2 rounded-full ${getStatusColor()} animate-pulse`} />
                <span className="text-white text-xs font-bold uppercase tracking-wider">
                  SERVER: {getStatusText()}
                </span>
              </div>
              <div className="text-gray-400 text-xs">
                Check #{lastCheckTime} • Every 3s
              </div>
              <div className="text-gray-500 text-xs mt-1">
                ws://localhost:2567
              </div>
            </div>

            {/* Activity Log - Bottom Left (Always Visible) */}
            <div className="fixed bottom-4 left-4 bg-black border-2 border-white p-3 z-50 max-w-md max-h-64 overflow-y-auto">
              <div className="text-white text-xs font-bold uppercase tracking-wider mb-2">ACTIVITY LOG</div>
              {errorLog.length === 0 ? (
                <div className="text-gray-500 text-xs">No activity yet...</div>
              ) : (
                errorLog.map((log, idx) => (
                  <div key={idx} className={`text-xs font-mono mb-1 ${log.isError ? 'text-red-400' : 'text-green-400'}`}>
                    {log.msg}
                  </div>
                ))
              )}
              <button
                onClick={() => setErrorLog([])}
                className="mt-2 px-2 py-1 bg-white text-black text-xs uppercase hover:bg-gray-300"
              >
                CLEAR
              </button>
            </div>
          </>
        );
      };

      return (
        <div>
          {view === 'main' && <MainMenuView />}
          {view === 'browse' && <BrowseLobbiesView />}
          {view === 'lobby' && <LobbyView />}
          {view === 'game' && <GameView />}
          <ServerStatusDisplay />
        </div>
      );
    };

    ReactDOM.render(<NakamaLobbySystem />, document.getElementById('root'));
  </script>
</body>
</html>
